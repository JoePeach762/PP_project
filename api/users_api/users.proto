syntax = "proto3";

package users.service.v1;

import "models/user_models/user_model.proto";
import "google/api/annotations.proto";

option go_package = "github.com/JoePeach762/PP_project/user_service/internal/pb/users_api";

service UserService {
  rpc CreateUsers(CreateUsersRequest) returns (CreateUsersResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      patch: "/v1/users/{UserId}"
      body: "*"
    };
  }

  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  rpc DeleteUsers(DeleteUsersRequest) returns (DeleteUsersResponse) {
    option (google.api.http) = {
      delete: "/v1/users/{ids}"
    };
  }
}

message CreateUsersRequest {
  repeated users.models.v1.UserInput users = 1;
}

message CreateUsersResponse {}

message UpdateUserRequest {
  // NOTE: Поле названо в PascalCase, из-за этого в HTTP path появляется /v1/users/{UserId}.
  // Для protobuf/gateway обычно безопаснее держать snake_case/lowerCamelCase, чтобы REST-контракт был предсказуемее.
  uint64 UserId = 1;
  users.models.v1.UserInput user = 2;
}

message UpdateUserResponse {}

message GetUsersRequest {
  repeated uint64 ids = 1;
}

message GetUsersResponse {
  repeated users.models.v1.UserInfo users = 1;
}

message DeleteUsersRequest {
  // TODO: repeated ids в path работает как CSV-параметр, но такой контракт неудобен и хрупок для клиентов.
  // Для пакетного удаления лучше query-параметр или тело POST/DELETE-операции.
  repeated uint64 ids = 1;
}

message DeleteUsersResponse {}
