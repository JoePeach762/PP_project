http_port: 8080
grpc_port: 50051

database:
  host: postgres-users
  port: 5432
  username: user
  password: pass
  name: users_db
  ssl_mode: disable

kafka:
  brokers:
    - kafka:9094
  meal_consumed_topic_name: "meal.consumed"
  user_deleted_topic_name: "user.deleted"

user_service:
  min_name_len: 1
  max_name_len: 100
  min_age: 1
  max_age: 100
  min_height_cm: 1
  max_height_cm: 300
  min_weight: 30
  max_weight: 200
  allowed_sexes:
    - male
    - female
